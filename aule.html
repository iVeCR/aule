<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orari aule</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --bar:#ffffff; --line:#d9dde3; --accent:#9b0014; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8eaed; --bar:#1d2025; --line:#33373e; --accent:#ff6b7d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px;
           background: var(--bar); border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; }
  .nav { flex-wrap: nowrap; }
  .tools { flex-wrap: wrap; }
  button, input[type=date], a.btn { font: inherit; color: inherit; background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
           text-decoration: none; }
  button:hover, a.btn:hover { border-color: var(--accent); }
  .arrow { font-size: 20px; line-height: 1; padding: 4px 14px; }
  select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 10px; max-width: 100%; }
  #label { flex: 1; min-width: 0; text-align: center; font-weight: 600; text-transform: capitalize; }
  #label small { display: block; font-weight: 400; opacity: .6; text-transform: none; }
  #wrap { flex: 1; min-height: 0; overflow: hidden; }
  #sizer { position: relative; overflow: hidden; }
  iframe { display: block; border: 0; background: #fff; transform-origin: 0 0; }
</style>
</head>
<body>
<header>
  <div class="row nav">
    <button class="arrow" id="prev" title="Giorno precedente (←)">‹</button>
    <div id="label"></div>
    <button class="arrow" id="next" title="Giorno successivo (→)">›</button>
  </div>
  <div class="row tools">
    <select id="sede" title="Edificio"></select>
    <button id="today" title="Torna a oggi (T)">Oggi</button>
    <input type="date" id="picker">
    <a class="btn" id="open" target="_blank" rel="noopener" title="Apri sul sito">↗</a>
  </div>
</header>
<div id="wrap"><div id="sizer"><iframe id="grid" title="Orari aule"></iframe></div></div>

<script>
// ---- Configurazione: aule selezionate (modifica qui per cambiarle) ----
const BASE = "https://agendastudentiunipd.easystaff.it/index.php";
// ---- Edifici (sedi). Cambia "label" per dare il nome che vuoi. ----
// "aule": elenco di aule da mostrare; se manca, il sito mostra tutte le aule della sede.
const SEDI = [
  { code: "00280",   label: "DEI", aule: [51436,51447,51304,51305,51438,51437,51435,100186,51306,51442,51441,51439,51440,100267,100269,51445] },
  { code: "1000084", label: "HUB" },
  { code: "00300",   label: "Bassi" },
];

function buildUrl(iso, s) {
  const p = new URLSearchParams();
  p.set("form-type", "rooms");
  p.set("view", "rooms");
  p.set("include", "rooms");
  p.set("aula", "");
  p.append("sede_get[]", s.code);
  p.append("sede[]", s.code);
  (s.aule || []).forEach(a => p.append("aula[]", a));
  p.set("date", iso);
  p.set("_lang", "it");
  p.set("list", "");
  p.set("week_grid_type", "-1");
  p.set("ar_codes_", "");
  p.set("ar_select_", "");
  p.set("col_cells", "0");
  p.set("empty_box", "0");
  p.set("only_grid", "1");
  p.set("highlighted_date", "0");
  p.set("all_events", "0");
  return BASE + "?" + p.toString();
}

const pad = n => String(n).padStart(2, "0");
const toIso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };

let current = new Date(); current.setHours(12,0,0,0);
let sedeCode = SEDI[0].code;
try { const sv = localStorage.getItem("sede"); if (SEDI.some(x => x.code === sv)) sedeCode = sv; } catch (e) {}
const m = location.hash.slice(1).match(/^(?:([^@]+)@)?(\d{4}-\d{2}-\d{2})$/);
if (m) {
  current = fromIso(m[2]);
  if (m[1] && SEDI.some(x => x.code === m[1])) sedeCode = m[1];
}

const $ = id => document.getElementById(id);

function render() {
  const iso = toIso(current);
  const url = buildUrl(iso, SEDI.find(x => x.code === sedeCode));
  $("grid").src = url;
  $("open").href = url.replace("only_grid=1", "only_grid=0");
  $("picker").value = iso;
  history.replaceState(null, "", "#" + sedeCode + "@" + iso);
  try { localStorage.setItem("sede", sedeCode); } catch (e) {}
  const long = current.toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  const isToday = iso === toIso(new Date());
  $("label").innerHTML = long + (isToday ? "<small>oggi</small>" : "");
  document.title = "Aule · " + iso;
}

function shift(days) { current.setDate(current.getDate() + days); render(); }

$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
$("today").onclick = () => { current = new Date(); current.setHours(12,0,0,0); render(); };
$("picker").onchange = e => { if (e.target.value) { current = fromIso(e.target.value); render(); } };

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") shift(-1);
  else if (e.key === "ArrowRight") shift(1);
  else if (e.key.toLowerCase() === "t") $("today").click();
});

// Il sito sceglie vista a griglia o elenco in base alla larghezza della finestra.
// Faccio "vedere" al sito una finestra larga DESKTOP_W px e la riduco per farla entrare nello schermo.
// Aumenta DESKTOP_W se la griglia è ancora a elenco; diminuiscilo per ingrandire il testo.
const DESKTOP_W = 1100;
function layout() {
  const wrap = $("wrap"), f = $("grid"), sizer = $("sizer");
  const W = Math.max(DESKTOP_W, wrap.clientWidth);
  const s = wrap.clientWidth / W;
  f.style.width = W + "px";
  f.style.height = (wrap.clientHeight / s) + "px";
  f.style.transform = "scale(" + s + ")";
  sizer.style.width = wrap.clientWidth + "px";
  sizer.style.height = wrap.clientHeight + "px";
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", layout);

SEDI.forEach(s => {
  const o = document.createElement("option");
  o.value = s.code; o.textContent = s.label;
  $("sede").appendChild(o);
});
$("sede").value = sedeCode;
$("sede").onchange = e => { sedeCode = e.target.value; render(); };

layout();
render();
</script>
</body>
</html>
